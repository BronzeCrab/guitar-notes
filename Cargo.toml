[package]
name = "guitar-notes"
version = "0.1.0"
edition = "2024"

[lib]
name = "guitar_notes"
path = "src/lib.rs"

[dependencies]
# Минимальный набор фич bevy: UI + текст + 2D-рендер (Camera2d) + picking для Interaction.
# Не используются: 3d/PBR, sprite, bevy_audio (звук через rodio), сцены, геймпады, clipboard, gizmos.
bevy = { version = "0.19.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "reflect_auto_register",
    "bevy_color",
    "bevy_input_focus",
    "bevy_text",
    "bevy_window",
    "bevy_winit",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_picking",
    "ui_picking",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
] }
rodio = "0.22.2"
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
console_error_panic_hook = "0.1.7"
wee_alloc = "0.4.5"

# getrandom's wasm_js/js backends must NOT be enabled for native targets
# (compile_error on Windows/Linux/macOS). Activate only for wasm builds.
[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[[bin]]
name = "guitar-notes"
path = "src/main.rs"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"