<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Guitar Notes - Interactive Fretboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }
        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100dvh;
            height: 100vh;
            padding: 12px 16px 8px;
            touch-action: none;
        }
        #app > h1 {
            flex: 0 0 auto;
            margin: 0 0 8px;
            font-size: 1.75rem;
            text-align: center;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #game {
            position: relative;
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            touch-action: none;
        }
        #guitar-notes-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            touch-action: none;
            border-radius: 10px;
        }
        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: #feca57;
            pointer-events: none;
            z-index: 2;
        }
        #audio-gate {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.65);
            padding: 16px;
        }
        #audio-gate .panel {
            background: #282833;
            border: 1px solid #737380;
            border-radius: 12px;
            padding: 24px 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        }
        #audio-gate h2 {
            font-size: 1.3rem;
            margin-bottom: 12px;
            color: #fff;
        }
        #audio-gate p {
            color: #d9d9e0;
            font-size: 0.95rem;
            line-height: 1.45;
            margin-bottom: 20px;
        }
        #enable-audio {
            appearance: none;
            border: 1px solid #737380;
            background: #383844;
            color: #fff;
            font-size: 1.05rem;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
        }
        #enable-audio:hover {
            background: #454555;
        }
        @media (max-width: 768px) {
            #app {
                padding: 8px 8px 4px;
            }
            #app > h1 {
                font-size: 1.35rem;
                margin-bottom: 6px;
            }
            .loading {
                font-size: 1.1rem;
            }
            #audio-gate .panel {
                padding: 20px 18px;
            }
        }
        @media (max-width: 480px) {
            #app {
                padding: 4px 4px 0;
            }
            #app > h1 {
                font-size: 1.1rem;
                margin-bottom: 4px;
            }
            #game {
                border-radius: 6px;
            }
            #guitar-notes-canvas {
                border-radius: 6px;
            }
            #audio-gate h2 {
                font-size: 1.15rem;
            }
            #audio-gate p {
                font-size: 0.9rem;
            }
            #enable-audio {
                width: 100%;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>Guitar Notes</h1>
        <div id="game">
            <canvas id="guitar-notes-canvas"></canvas>
            <div id="loading" class="loading">Загрузка WASM...</div>
        </div>
    </div>

    <div id="audio-gate" role="dialog" aria-modal="true" aria-labelledby="audio-gate-title">
        <div class="panel">
            <h2 id="audio-gate-title">Включить звук</h2>
            <p>
                Браузер блокирует аудио до первого клика.
                Нажмите кнопку, чтобы разрешить воспроизведение нот.
            </p>
            <button type="button" id="enable-audio">Включить звук</button>
        </div>
    </div>

    <script>
        // Track AudioContexts created by cpal/rodio so we can resume them after a user gesture.
        window.__audioContexts = [];
        (function patchAudioContext() {
            const Original = window.AudioContext || window.webkitAudioContext;
            if (!Original) return;
            function PatchedAudioContext(...args) {
                const ctx = new Original(...args);
                window.__audioContexts.push(ctx);
                return ctx;
            }
            PatchedAudioContext.prototype = Original.prototype;
            Object.setPrototypeOf(PatchedAudioContext, Original);
            window.AudioContext = PatchedAudioContext;
            if ('webkitAudioContext' in window) {
                window.webkitAudioContext = PatchedAudioContext;
            }
        })();
    </script>
    <script type="module">
        import init from './guitar_notes.js';

        async function unlockAudio() {
            const contexts = window.__audioContexts || [];
            await Promise.all(
                contexts.map(async (ctx) => {
                    try {
                        if (ctx.state === 'suspended') {
                            await ctx.resume();
                        }
                    } catch (e) {
                        console.warn('AudioContext resume failed', e);
                    }
                })
            );
        }

        try {
            await init();
            document.getElementById('loading').style.display = 'none';

            const gate = document.getElementById('audio-gate');
            const button = document.getElementById('enable-audio');
            gate.style.display = 'flex';

            button.addEventListener('click', async () => {
                await unlockAudio();
                gate.style.display = 'none';
            });
        } catch (e) {
            document.getElementById('loading').textContent = 'Ошибка загрузки: ' + e.message;
            console.error(e);
        }
    </script>
</body>
</html>
